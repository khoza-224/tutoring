<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Tutoring System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main>
    <h1>Student Registration</h1>
    <form id="registerForm" action="register.php" method="post">

      <div class="row">
        <div>
          <label for="first_name">First name</label>
          <input type="text" id="first_name" name="first_name"
                 required minlength="2" maxlength="60"
                 pattern="[A-Za-z' \-]+" autocomplete="given-name"
                 title="Letters, spaces, apostrophes and hyphens only"
                 placeholder="Ayanda">
        </div>
        <div>
          <label for="last_name">Last name</label>
          <input type="text" id="last_name" name="last_name"
                 required minlength="2" maxlength="60"
                 pattern="[A-Za-z' \-]+" autocomplete="family-name"
                 title="Letters, spaces, apostrophes and hyphens only"
                 placeholder="Zulu">
        </div>
      </div>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email"
             required maxlength="150" autocomplete="email"
             placeholder="name@example.com">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone"
             required pattern="0[0-9]{9}" maxlength="10"
             autocomplete="tel"
             title="Enter a 10-digit number starting with 0"
             placeholder="0711234567">
      <small>10 digits, starting with 0.</small>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             required minlength="8" maxlength="72"
             pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
             autocomplete="new-password"
             title="At least 8 characters with an uppercase letter, a lowercase letter and a number">
      <small>At least 8 characters, with uppercase, lowercase and a number.</small>

      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             required minlength="8" maxlength="72"
             autocomplete="new-password">

      <label>
        <input type="checkbox" id="terms" name="terms" value="1" required style="width:auto">
        I agree to the terms and conditions
      </label>

      <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="login.html">Log in here</a>.</p>
  </main>

  <script src="validation.js"></script>
</body>
</html>
